# NodePort 30082, como o OS Service (30080): o ALB interno do infra-k8s usa
# alvos do tipo instancia e entrega o trafego nesta porta de cada node
# (infra/alb-servicos.tf, F4-14). A porta precisa casar com a de la -
# divergir derruba o health check e o ALB devolve 502 so para este servico.
#
# Continua alcancavel pelo DNS do cluster
# (oficina-mecanica-execucao.oficina-mecanica.svc.cluster.local), que e o caminho
# das chamadas internas entre servicos. Nunca LoadBalancer: o Kubernetes
# criaria um ELB fora do Terraform, que ninguem destroi e que segue cobrando.
apiVersion: v1
kind: Service
metadata:
  name: oficina-mecanica-execucao
  labels:
    app: oficina-mecanica-execucao
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  type: NodePort
  selector:
    app: oficina-mecanica-execucao
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30082
