apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-mecanica-execucao
  labels:
    app: oficina-mecanica-execucao
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-mecanica-execucao
  template:
    metadata:
      labels:
        app: oficina-mecanica-execucao
        app.kubernetes.io/part-of: oficina-mecanica
        # Unified service tagging: logs, traces e metricas do pod com o mesmo
        # service/env no Datadog, para o log abrir o trace e vice-versa (F4-32).
        tags.datadoghq.com/service: oficina-mecanica-execucao
        tags.datadoghq.com/env: __AMBIENTE__
      annotations:
        # source csharp aplica o pipeline de logs .NET do Datadog; o JSON do
        # servico ja traz dd.trace_id/dd.span_id para a correlacao com o trace.
        ad.datadoghq.com/api.logs: '[{"source":"csharp","service":"oficina-mecanica-execucao"}]'
    spec:
      containers:
        - name: api
          image: oficina-mecanica-execucao
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-mecanica-execucao-config
            # Montado pela pipeline a partir do Secrets Manager (input segredos);
            # nunca versionado. Sem ele o pod nao sobe, o que e o desejado.
            - secretRef:
                name: oficina-mecanica-execucao-secret
          env:
            - name: DD_SERVICE
              value: oficina-mecanica-execucao
            - name: DD_ENV
              value: __AMBIENTE__
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          # readiness inclui as dependencias; liveness so confere o processo,
          # para uma dependencia fora do ar nao reiniciar o pod a toa.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # Request de memoria igual ao do OS Service (256Mi). Com 128Mi o HPA via
          # 98% de uso medio so com o runtime do .NET subido e escalava ate 6 pods
          # sem carga (ensaio de 09/11 no dev, F4-38). Limit segue 512Mi.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
