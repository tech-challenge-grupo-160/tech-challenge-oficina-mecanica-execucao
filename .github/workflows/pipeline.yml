# CI/CD do servico: chama o pipeline reutilizavel do tech-challenge-pipelines
# (F4-08). PR roda so build e testes; push na homolog/main publica
# no ambiente da branch; o disparo manual publica no ambiente escolhido - e
# assim que se publica em dev.
name: Pipeline

on:
  pull_request:
    branches: [develop, homolog, main]
  push:
    branches: [homolog, main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente de destino"
        type: choice
        options: [desenvolvimento, homologacao, producao]
        default: desenvolvimento

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline
    uses: tech-challenge-grupo-160/tech-challenge-pipelines/.github/workflows/servico-dotnet.yml@v1
    with:
      servico: oficina-mecanica-execucao
      solucao: Fiap.TechChallenge.OficinaMecanica.Execucao.slnx
      imagem: execucao
      regiao_aws: ${{ vars.AWS_REGION || 'us-east-1' }}
      ambiente: ${{ github.event_name == 'workflow_dispatch' && inputs.ambiente || (github.event_name == 'push' && (github.ref_name == 'main' && 'producao' || 'homologacao')) || '' }}
      # Enderecos de mensageria (F4-11), montados no oficina-mecanica-execucao-secret
      # a cada deploy a partir do Secrets Manager, como no OS Service. As
      # chaves sao as do segredo criado pelo Terraform deste repositorio
      # (infra/messaging.tf), com os nomes que o codigo le: uma fila por tipo de
      # mensagem, como no LocalStack (adendo de 11/11 a ADR-0005).
      # Messaging__Enabled vem do mesmo segredo e liga os workers.
      # A connection string vem do RDS proprio da Execucao (F4-12), criado no
      # tech-challenge-infra-database; o OS Service nao recebe este segredo.
      segredos: |
        ConnectionStrings__DefaultConnection=tc-grupo160/{sufixo}/execucao/banco#connectionString
        Messaging__Enabled=tc-grupo160/{sufixo}/execucao/messaging#Messaging__Enabled
        Messaging__EventosTopicArn=tc-grupo160/{sufixo}/execucao/messaging#Messaging__EventosTopicArn
        Messaging__InicioDiagnosticoQueueUrl=tc-grupo160/{sufixo}/execucao/messaging#Messaging__InicioDiagnosticoQueueUrl
        Messaging__ReservaPecasQueueUrl=tc-grupo160/{sufixo}/execucao/messaging#Messaging__ReservaPecasQueueUrl
        Messaging__InicioExecucaoQueueUrl=tc-grupo160/{sufixo}/execucao/messaging#Messaging__InicioExecucaoQueueUrl
      # Migrations do EF Core sao codigo gerado: fora da analise de duplicacao
      # e da cobertura, assim como no pipeline do OS Service.
      sonar_exclusoes: "**/Migrations/**"
    secrets: inherit
