# Provisorio: build e testes em todo PR. A F4-08 troca este arquivo pelo
# workflow reutilizavel com Sonar, imagem no ECR e deploy no EKS.
name: PR CI

on:
  pull_request:
    branches:
      - develop
      - homolog
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: 'Release'
  SOLUTION_FILE: 'Fiap.TechChallenge.OficinaMecanica.Execucao.slnx'
  COVERAGE_SETTINGS: 'coverlet.runsettings'

jobs:
  ci:
    name: Build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build solution
        run: >
          dotnet build ${{ env.SOLUTION_FILE }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore

      - name: Run tests
        run: >
          dotnet test ${{ env.SOLUTION_FILE }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --no-restore
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --settings ${{ env.COVERAGE_SETTINGS }}
          --logger "trx"
          --results-directory TestResults

      - name: Build Docker image
        run: docker build --target runtime -f docker/backend/Dockerfile -t oficina-mecanica-execucao:ci .

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: error

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
