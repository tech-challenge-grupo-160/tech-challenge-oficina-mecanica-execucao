services:
  postgres:
    image: postgres:16-alpine
    container_name: oficina-mecanica-execucao-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-oficina_execucao}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - oficina-mecanica-execucao-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficina_execucao -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
      target: runtime
    image: fiap-techchallenge-oficina-mecanica-execucao:latest
    container_name: oficina-mecanica-execucao-dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # A imagem roda com o Datadog Tracer habilitado, mas o compose local nao
      # sobe um Datadog Agent.
      DD_TRACE_ENABLED: "false"
      ConnectionStrings__DefaultConnection: ${API_CONNECTION_STRING:-Host=postgres;Database=oficina_execucao;Username=postgres;Password=postgres}
    ports:
      - "${API_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oficina-mecanica-execucao-postgres-data:
